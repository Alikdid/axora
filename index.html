<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050814;
  color:white;
}

header{
  background:#0f172a;
  padding:25px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

h1{
  margin:0;
  font-size:60px;
}

.nav button{
  background:#111827;
  color:white;
  border:1px solid #334155;
  padding:10px 14px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:380px;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  padding:20px;
}

.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:15px;
  text-decoration:none;
  color:white;
  transition:0.2s;
}

.game:hover{
  transform:scale(1.05);
  border-color:#38bdf8;
}

.thumb{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:#0b1220;
}

.game div{
  padding:10px;
  text-align:center;
  font-weight:bold;
}

footer{
  text-align:center;
  padding:20px;
  margin-top:30px;
  background:#0f172a;
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>
</header>

<div class="search">
  <input placeholder="Search games (visual only)">
</div>

<div class="games">

  <!-- STABILA "GAMES" (INGA DÖDA LÄNKAR) -->

  <a class="game" href="drift-king.html">
    <div class="thumb">🚗</div>
    <div>Drift King (Your Game)</div>
  </a>

  <div class="game">
    <div class="thumb">🏎️</div>
    <div>Racing Games Pack</div>
  </div>

  <div class="game">
    <div class="thumb">🔫</div>
    <div>Action Games Pack</div>
  </div>

  <div class="game">
    <div class="thumb">🧠</div>
    <div>Puzzle Games Pack</div>
  </div>

  <div class="game">
    <div class="thumb">⚔️</div>
    <div>Adventure Pack</div>
  </div>

</div>

<footer>
  © 2026 Axora — Stable Platform
</footer>

</body>
</html>
