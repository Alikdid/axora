<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050814;
  color:white;
}

header{
  background:#0f172a;
  padding:25px;
  text-align:center;
}

h1{
  margin:0;
  font-size:60px;
}

.nav{
  margin-top:10px;
}

.nav button{
  background:#111827;
  color:white;
  border:1px solid #334155;
  padding:10px 14px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:360px;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  padding:20px;
}

.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:15px;
  padding:15px;
  text-align:center;
}

.thumb{
  font-size:40px;
  margin-bottom:10px;
}

.hidden{
  display:none;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button data-filter="all">Home</button>
    <button data-filter="racing">Racing</button>
    <button data-filter="action">Action</button>
    <button data-filter="puzzle">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" placeholder="Search games...">
</div>

<div class="games">

  <div class="game racing">
    <div class="thumb">🚗</div>
    Drift Boss
  </div>

  <div class="game racing">
    <div class="thumb">🏎️</div>
    Stunt Cars
  </div>

  <div class="game action">
    <div class="thumb">🔫</div>
    Action Pack
  </div>

  <div class="game puzzle">
    <div class="thumb">🧠</div>
    Puzzle Pack
  </div>

</div>

<script>
// SEARCH
const search = document.getElementById("search");
const games = document.querySelectorAll(".game");

search.addEventListener("input", () => {
  const value = search.value.toLowerCase();

  games.forEach(game => {
    game.style.display =
      game.innerText.toLowerCase().includes(value)
      ? "block"
      : "none";
  });
});

// FILTER BUTTONS (SAFE METHOD)
const buttons = document.querySelectorAll(".nav button");

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    const filter = btn.dataset.filter;

    games.forEach(game => {
      if(filter === "all"){
        game.style.display = "block";
      } else {
        game.style.display =
          game.classList.contains(filter)
          ? "block"
          : "none";
      }
    });
  });
});
</script>

</body>
</html>
