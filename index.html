<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050814;
  color:white;
}

header{
  background:#0f172a;
  padding:25px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

h1{
  margin:0;
  font-size:60px;
}

.nav button{
  background:#111827;
  color:white;
  border:1px solid #334155;
  padding:10px 14px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.nav button:hover{
  border-color:#38bdf8;
}

.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:360px;
  padding:12px;
  border-radius:10px;
  border:none;
}

.title{
  font-size:26px;
  margin:20px;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  padding:20px;
}

.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:15px;
  text-decoration:none;
  color:white;
  overflow:hidden;
  transition:0.2s;
}

.game:hover{
  transform:scale(1.05);
  border-color:#38bdf8;
}

.thumb{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  background:#0b1220;
}

.game div{
  padding:10px;
  text-align:center;
  font-weight:bold;
}

.hidden{
  display:none;
}

footer{
  text-align:center;
  padding:20px;
  margin-top:30px;
  background:#0f172a;
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button onclick="filter('all')">Home</button>
    <button onclick="filter('action')">Action</button>
    <button onclick="filter('racing')">Racing</button>
    <button onclick="filter('puzzle')">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" onkeyup="searchGames()" placeholder="Search games...">
</div>

<div class="title">🔥 Games</div>

<div class="games">

  <a class="game racing" href="drift-king.html">
    <div class="thumb">🚗</div>
    <div>Drift Boss</div>
  </a>

  <a class="game racing" href="https://www.crazygames.com/game/madalin-stunt-cars-2" target="_blank">
    <div class="thumb">🏎️</div>
    <div>Stunt Cars</div>
  </a>

  <a class="game action" href="https://www.crazygames.com/game/warbrokers" target="_blank">
    <div class="thumb">🔫</div>
    <div>War Brokers</div>
  </a>

  <a class="game puzzle" href="https://www.crazygames.com/game/2048" target="_blank">
    <div class="thumb">🧠</div>
    <div>2048</div>
  </a>

</div>

<footer>
  © 2026 Axora
</footer>

<script>
function searchGames(){
  let input=document.getElementById("search").value.toLowerCase();
  let games=document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    let text=games[i].innerText.toLowerCase();
    games[i].style.display=text.includes(input)?"block":"none";
  }
}

function filter(type){
  let games=document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    if(type==="all"){
      games[i].style.display="block";
    } else {
      games[i].style.display=games[i].classList.contains(type)?"block":"none";
    }
  }
}
</script>

</body>
</html>
