<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050814;
  color:white;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#0b1220,#0f172a);
  padding:30px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

h1{
  margin:0;
  font-size:65px;
  letter-spacing:4px;
}

.nav{
  margin-top:12px;
}

.nav button{
  background:#0f172a;
  color:white;
  border:1px solid #334155;
  padding:10px 15px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.nav button:hover{
  border-color:#60a5fa;
}

/* SEARCH */
.search{
  text-align:center;
  margin:25px;
}

.search input{
  width:400px;
  max-width:90%;
  padding:14px;
  border-radius:10px;
  border:none;
  outline:none;
  font-size:16px;
}

/* TITLE */
.title{
  font-size:28px;
  margin:20px 30px;
}

/* GRID */
.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:18px;
  padding:20px;
}

/* CARD */
.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:16px;
  text-decoration:none;
  color:white;
  overflow:hidden;
  transition:0.2s;
}

.game:hover{
  transform:scale(1.05);
  border-color:#38bdf8;
}

/* THUMB (100% STABIL) */
.thumb{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:#0b1220;
}

/* TEXT */
.game div{
  padding:12px;
  text-align:center;
  font-weight:bold;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  margin-top:40px;
  background:#0f172a;
  border-top:1px solid #1f2937;
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button>Home</button>
    <button>Trending</button>
    <button>New</button>
    <button>Categories</button>
  </div>
</header>

<div class="search">
  <input type="text" placeholder="Search games...">
</div>

<div class="title">🔥 Featured Games</div>

<div class="games">

  <a class="game" href="drift-king.html">
    <div class="thumb">🚗</div>
    <div>Drift King</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">🏎️</div>
    <div>Racing Games</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">🔫</div>
    <div>Action Games</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">🧠</div>
    <div>Puzzle Games</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">⚔️</div>
    <div>Adventure</div>
  </a>

</div>

<footer>
  © 2026 Axora - Play Free Online Games
</footer>

</body>
</html>
