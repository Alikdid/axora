<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

/* HEADER */
header {
  background: #1a1a1a;
  text-align: center;
  padding: 20px;
  border-bottom: 1px solid #333;
}

h1 {
  margin: 0;
  font-size: 60px;
}

/* NAV */
.nav button {
  background: #222;
  color: white;
  border: 1px solid #444;
  padding: 10px 14px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.nav button:hover {
  background: #333;
}

/* SEARCH */
.search {
  text-align: center;
  margin: 20px;
}

.search input {
  width: 320px;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

/* SECTION */
.section {
  padding: 10px 20px;
}

.title {
  font-size: 24px;
  margin: 20px 0 10px;
}

/* GAME GRID */
.games {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

/* GAME CARD */
.game {
  width: 200px;
  height: 150px;
  background: #222;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  overflow: hidden;
  transition: 0.2s;
  display: flex;
  flex-direction: column;
}

.game:hover {
  transform: scale(1.05);
  background: #333;
}

/* IMAGE */
.game img {
  width: 100%;
  height: 90px;
  object-fit: cover;
}

/* TEXT */
.game div {
  padding: 8px;
  text-align: center;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 30px;
  background: #1a1a1a;
  border-top: 1px solid #333;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button onclick="filterGames('all')">Home</button>
    <button onclick="filterGames('trending')">Trending</button>
    <button onclick="filterGames('new')">New</button>
  </div>
</header>

<div class="search">
  <input type="text" id="search" onkeyup="searchGames()" placeholder="Search games...">
</div>

<div class="section">

<div class="title">🔥 Games</div>

<div class="games" id="games">

  <a class="game trending" href="drift-king.html">
    <img src="https://via.placeholder.com/200x90.png?text=Drift+King">
    <div>Drift King</div>
  </a>

  <a class="game trending" href="https://www.crazygames.com/game/stunt-car-challenge" target="_blank">
    <img src="https://via.placeholder.com/200x90.png?text=Stunt+Car">
    <div>Stunt Car</div>
  </a>

  <a class="game new" href="https://www.crazygames.com/game/battle-royale" target="_blank">
    <img src="https://via.placeholder.com/200x90.png?text=Battle">
    <div>Battle Game</div>
  </a>

  <a class="game new" href="https://www.crazygames.com" target="_blank">
    <img src="https://via.placeholder.com/200x90.png?text=Puzzle">
    <div>Puzzle Game</div>
  </a>

</div>

</div>

<footer>
  © 2026 Axora
</footer>

<script>
function searchGames() {
  let input = document.getElementById("search").value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for (let i = 0; i < games.length; i++) {
    let title = games[i].innerText.toLowerCase();
    games[i].style.display = title.includes(input) ? "flex" : "none";
  }
}

function filterGames(category) {
  let games = document.getElementsByClassName("game");

  for (let i = 0; i < games.length; i++) {
    if (category === "all") {
      games[i].style.display = "flex";
    } else {
      games[i].style.display =
        games[i].classList.contains(category) ? "flex" : "none";
    }
  }
}
</script>

</body>
</html>
