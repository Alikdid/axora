<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
}

/* HEADER */
header{
  background:#111827;
  padding:20px;
  text-align:center;
}

h1{
  margin:0;
  font-size:50px;
}

/* BUTTONS */
.nav{
  margin-top:10px;
}

.nav button{
  background:#1f2937;
  color:white;
  border:1px solid #374151;
  padding:10px 14px;
  margin:5px;
  border-radius:8px;
  cursor:pointer;
}

/* SEARCH */
.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:300px;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* GRID */
.games{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

/* CARD */
.game{
  width:180px;
  background:#111827;
  border:1px solid #374151;
  border-radius:10px;
  padding:15px;
  text-align:center;
  cursor:pointer;
}

/* ICON */
.thumb{
  font-size:40px;
  margin-bottom:10px;
}

/* HIDE */
.hidden{
  display:none;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button data="all">Home</button>
    <button data="racing">Racing</button>
    <button data="action">Action</button>
    <button data="puzzle">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" placeholder="Search games...">
</div>

<div class="games">

  <div class="game racing">
    <div class="thumb">🚗</div>
    Drift Boss
  </div>

  <div class="game racing">
    <div class="thumb">🏎️</div>
    Racing Game
  </div>

  <div class="game action">
    <div class="thumb">🔫</div>
    Action Game
  </div>

  <div class="game puzzle">
    <div class="thumb">🧠</div>
    Puzzle Game
  </div>

</div>

<script>
const buttons = document.querySelectorAll(".nav button");
const games = document.querySelectorAll(".game");
const search = document.getElementById("search");

// FILTER
buttons.forEach(btn=>{
  btn.onclick = ()=>{
    const type = btn.getAttribute("data");

    games.forEach(g=>{
      if(type==="all") g.style.display="block";
      else g.style.display = g.classList.contains(type) ? "block" : "none";
    });
  }
});

// SEARCH
search.oninput = ()=>{
  const value = search.value.toLowerCase();

  games.forEach(g=>{
    g.style.display = g.innerText.toLowerCase().includes(value)
      ? "block"
      : "none";
  });
};
</script>

</body>
</html>
