<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #070b14;
  color: white;
}

/* TOP BAR */
header {
  background: linear-gradient(90deg, #0f172a, #111827);
  padding: 25px;
  text-align: center;
  border-bottom: 1px solid #1f2937;
}

h1 {
  margin: 0;
  font-size: 64px;
  letter-spacing: 3px;
}

/* NAV */
.nav {
  margin-top: 10px;
}

.nav button {
  background: #111827;
  color: white;
  border: 1px solid #374151;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
  transition: 0.2s;
}

.nav button:hover {
  background: #1f2937;
  border-color: #60a5fa;
}

/* SEARCH */
.search {
  text-align: center;
  margin: 25px;
}

.search input {
  width: 380px;
  padding: 14px;
  border-radius: 10px;
  border: none;
  outline: none;
  font-size: 16px;
}

/* SECTION TITLE */
.title {
  font-size: 28px;
  margin: 20px 30px;
}

/* GRID */
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 18px;
  padding: 20px;
}

/* GAME CARD */
.game {
  background: #0f172a;
  border-radius: 15px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  border: 1px solid #1f2937;
  transition: 0.25s;
}

.game:hover {
  transform: scale(1.05);
  border-color: #60a5fa;
}

/* IMAGE (STABIL – INGA EXTERNA LÄNKAR) */
.thumb {
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  background: #111827;
}

/* TEXT */
.game div {
  padding: 12px;
  text-align: center;
  font-weight: bold;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 40px;
  background: #0f172a;
  border-top: 1px solid #1f2937;
  font-size: 12px;
  opacity: 0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button>Home</button>
    <button>Trending</button>
    <button>New</button>
    <button>Categories</button>
  </div>
</header>

<div class="search">
  <input type="text" placeholder="Search games...">
</div>

<div class="title">🔥 Featured Games</div>

<div class="games">

  <a class="game" href="drift-king.html">
    <div class="thumb">🚗</div>
    <div>Drift King</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">🏎️</div>
    <div>Racing Hub</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">🔫</div>
    <div>Action Games</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">🧠</div>
    <div>Puzzle Games</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <div class="thumb">⚔️</div>
    <div>Adventure</div>
  </a>

</div>

<footer>
  © 2026 Axora - Play Free Games
</footer>

</body>
</html>
