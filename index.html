<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
}

header{
  text-align:center;
  background:#111827;
  padding:20px;
}

h1{
  margin:0;
  font-size:40px;
}

button{
  background:#1f2937;
  color:white;
  border:1px solid #374151;
  padding:10px;
  margin:5px;
  border-radius:8px;
  cursor:pointer;
}

.search{
  text-align:center;
  margin:20px;
}

input{
  padding:10px;
  width:250px;
  border-radius:8px;
  border:none;
}

.games{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:10px;
}

.game{
  width:150px;
  background:#111827;
  padding:10px;
  border-radius:10px;
  text-align:center;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div>
    <button onclick="show('all')">Home</button>
    <button onclick="show('racing')">Racing</button>
    <button onclick="show('action')">Action</button>
    <button onclick="show('puzzle')">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" oninput="search()" placeholder="Search...">
</div>

<div class="games">

  <div class="game racing">🚗 Drift</div>
  <div class="game racing">🏎️ Race</div>
  <div class="game action">🔫 Action</div>
  <div class="game puzzle">🧠 Puzzle</div>

</div>

<script>
function show(type){
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    if(type === "all"){
      games[i].style.display = "block";
    } else {
      games[i].style.display =
        games[i].classList.contains(type) ? "block" : "none";
    }
  }
}

function search(){
  let value = document.getElementById("search").value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    let text = games[i].innerText.toLowerCase();
    games[i].style.display = text.includes(value) ? "block" : "none";
  }
}
</script>

</body>
</html>
