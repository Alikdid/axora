<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f0f0f;
  color: white;
}

header {
  background: #1a1a1a;
  padding: 25px;
  text-align: center;
  border-bottom: 1px solid #333;
}

h1 {
  margin: 0;
  font-size: 60px;
  letter-spacing: 2px;
}

.nav {
  margin-top: 15px;
}

.nav button {
  background: #222;
  color: white;
  border: 1px solid #444;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.nav button:hover {
  background: #333;
}

.search {
  text-align: center;
  margin: 25px;
}

.search input {
  width: 320px;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

.section {
  padding: 10px 20px;
}

.title {
  font-size: 24px;
  margin: 20px 0 10px;
}

.games {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

.game {
  width: 200px;
  height: 130px;
  background: #222;
  border-radius: 12px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-decoration: none;
  color: white;
  transition: 0.2s;
}

.game:hover {
  transform: scale(1.05);
  background: #333;
}

.small {
  font-size: 12px;
  opacity: 0.7;
}

footer {
  text-align: center;
  padding: 20px;
  background: #1a1a1a;
  margin-top: 40px;
  border-top: 1px solid #333;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button>Home</button>
    <button>Trending</button>
    <button>New</button>
    <button>Categories</button>
  </div>
</header>

<div class="search">
  <input type="text" placeholder="Search games...">
</div>

<div class="section">
  <div class="title">🔥 Featured Games</div>

  <div class="games">

    <a class="game" href="drift-king.html">
      🚗
      <div>Drift King</div>
      <div class="small">Play now</div>
    </a>

    <a class="game" href="https://www.crazygames.com/game/battle-royale" target="_blank">
      🔫
      <div>Battle Royale</div>
      <div class="small">External</div>
    </a>

    <a class="game" href="https://www.crazygames.com/game/puzzle" target="_blank">
      🧠
      <div>Puzzle Game</div>
      <div class="small">External</div>
    </a>

  </div>
</div>

<div class="section">
  <div class="title">🔥 Trending Games</div>

  <div class="games">

    <a class="game" href="https://www.crazygames.com" target="_blank">
      🏎️
      <div>Racing Hub</div>
      <div class="small">Play games</div>
    </a>

    <a class="game" href="https://www.crazygames.com" target="_blank">
      ⚔️
      <div>Action Hub</div>
      <div class="small">Play games</div>
    </a>

  </div>
</div>

<footer>
  © 2026 Axora - Free Online Games
</footer>

</body>
</html>
