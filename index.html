<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
}

header{
  background:#111827;
  padding:20px;
  text-align:center;
}

h1{
  margin:0;
  font-size:50px;
}

.nav button{
  background:#1f2937;
  color:white;
  border:1px solid #374151;
  padding:10px 14px;
  margin:5px;
  border-radius:8px;
  cursor:pointer;
}

.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:300px;
  padding:10px;
  border-radius:8px;
  border:none;
}

.games{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:20px;
}

.game{
  width:180px;
  background:#111827;
  border:1px solid #374151;
  border-radius:10px;
  padding:15px;
  text-align:center;
}

.thumb{
  font-size:40px;
  margin-bottom:10px;
}

.hidden{
  display:none;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button data-type="all">Home</button>
    <button data-type="racing">Racing</button>
    <button data-type="action">Action</button>
    <button data-type="puzzle">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" placeholder="Search games...">
</div>

<div class="games">

  <div class="game racing">
    <div class="thumb">🚗</div>
    Drift Boss
  </div>

  <div class="game racing">
    <div class="thumb">🏎️</div>
    Racing Game
  </div>

  <div class="game action">
    <div class="thumb">🔫</div>
    Action Game
  </div>

  <div class="game puzzle">
    <div class="thumb">🧠</div>
    Puzzle Game
  </div>

</div>

<script>

const buttons = document.querySelectorAll(".nav button");
const games = document.querySelectorAll(".game");
const search = document.getElementById("search");

// FILTER (FIXED CLICK)
buttons.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const type = btn.dataset.type;

    games.forEach(game=>{
      if(type === "all"){
        game.style.display = "block";
      } else {
        game.style.display = game.classList.contains(type)
          ? "block"
          : "none";
      }
    });
  });
});

// SEARCH (WORKS)
search.addEventListener("input", ()=>{
  const value = search.value.toLowerCase();

  games.forEach(game=>{
    const text = game.innerText.toLowerCase();
    game.style.display = text.includes(value) ? "block" : "none";
  });
});

</script>

</body>
</html>
