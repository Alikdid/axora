<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#050816;
  color:white;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#0f172a,#111827);
  padding:30px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

h1{
  margin:0;
  font-size:60px;
  letter-spacing:3px;
}

p{
  margin:10px 0 0 0;
  opacity:0.7;
}

/* NAV */
.nav{
  margin-top:15px;
}

.nav button{
  background:#111827;
  color:white;
  border:1px solid #374151;
  padding:10px 15px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
  transition:0.2s;
}

.nav button:hover{
  border-color:#38bdf8;
  transform:scale(1.05);
}

/* SEARCH */
.search{
  text-align:center;
  margin:25px;
}

.search input{
  width:400px;
  max-width:90%;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* GAMES GRID */
.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  padding:25px;
}

/* GAME CARD */
.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:15px;
  text-align:center;
  padding:15px;
  cursor:pointer;
  transition:0.2s;
}

.game:hover{
  transform:scale(1.05);
  border-color:#38bdf8;
}

.thumb{
  font-size:45px;
  margin-bottom:10px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:25px;
  margin-top:30px;
  background:#0f172a;
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>
  <p>Play free online games</p>

  <div class="nav">
    <button onclick="filter('all')">Home</button>
    <button onclick="filter('racing')">Racing</button>
    <button onclick="filter('action')">Action</button>
    <button onclick="filter('puzzle')">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" oninput="searchGames()" placeholder="Search games...">
</div>

<div class="games" id="gameGrid">

  <div class="game racing">
    <div class="thumb">🚗</div>
    Drift Boss
  </div>

  <div class="game racing">
    <div class="thumb">🏎️</div>
    Racing Stunt
  </div>

  <div class="game action">
    <div class="thumb">🔫</div>
    Action Battle
  </div>

  <div class="game puzzle">
    <div class="thumb">🧠</div>
    Puzzle Master
  </div>

  <div class="game action">
    <div class="thumb">⚔️</div>
    Combat Arena
  </div>

  <div class="game puzzle">
    <div class="thumb">🎯</div>
    Brain Test
  </div>

</div>

<footer>
  © 2026 Axora - Game Platform
</footer>

<script>

function filter(type){
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    if(type === "all"){
      games[i].style.display = "block";
    } else {
      games[i].style.display =
        games[i].classList.contains(type) ? "block" : "none";
    }
  }
}

function searchGames(){
  let input = document.getElementById("search").value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    let text = games[i].innerText.toLowerCase();
    games[i].style.display = text.includes(input) ? "block" : "none";
  }
}

</script>

</body>
</html>
