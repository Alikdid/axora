<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
  margin: 0;
}

header {
  background: #1a1a1a;
  padding: 20px;
}

h1 {
  margin: 0;
  font-size: 50px;
}

input {
  padding: 12px;
  width: 300px;
  border-radius: 8px;
  border: none;
}

button {
  background: #222;
  color: white;
  border: 1px solid #444;
  padding: 10px 15px;
  border-radius: 8px;
  margin: 5px;
  cursor: pointer;
}

button:hover {
  background: #333;
}

.games {
  margin-top: 30px;
}

.game-box {
  background: #222;
  width: 220px;
  padding: 20px;
  margin: 10px;
  display: inline-block;
  border-radius: 12px;
  text-decoration: none;
  color: white;
}

.game-box:hover {
  background: #333;
}
</style>

</head>
<body>

<header>
 <h1>AXORA</h1>
 <div>

    <button>New Games</button>
    <button>Trending</button>

  </div>

  <p>Play Free Online Games</p>
</header>

<br>

<input type="text" placeholder="Search games...">

<br><br>

</html>
