<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050816;
  color:white;
}

/* HEADER */
header{
  background:#0f172a;
  padding:25px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

h1{
  margin:0;
  font-size:60px;
  letter-spacing:3px;
}

/* NAV */
.nav{
  margin-top:15px;
}

.nav button{
  background:#111827;
  color:white;
  border:1px solid #334155;
  padding:10px 14px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.nav button:hover{
  border-color:#38bdf8;
}

/* SEARCH */
.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:380px;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

/* GRID */
.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  padding:20px;
}

/* CARD */
.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:15px;
  text-decoration:none;
  color:white;
  overflow:hidden;
  transition:0.2s;
}

.game:hover{
  transform:scale(1.05);
  border-color:#60a5fa;
}

/* ICON */
.thumb{
  height:120px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:42px;
  background:#0b1220;
}

.game div{
  padding:10px;
  text-align:center;
  font-weight:bold;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  margin-top:30px;
  background:#0f172a;
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <!-- NAV (FIX) -->
  <div class="nav">
    <button onclick="filter('all')">Home</button>
    <button onclick="filter('racing')">Racing</button>
    <button onclick="filter('action')">Action</button>
    <button onclick="filter('puzzle')">Puzzle</button>
  </div>

  <!-- SEARCH (FIX) -->
  <div class="search">
    <input id="search" onkeyup="searchGames()" placeholder="Search games...">
  </div>
</header>

<!-- GAMES -->
<div class="games" id="gameGrid">

  <a class="game racing" href="drift-king.html">
    <div class="thumb">🚗</div>
    <div>Drift King</div>
  </a>

  <a class="game racing" href="racing.html">
    <div class="thumb">🏎️</div>
    <div>Racing Games</div>
  </a>

  <a class="game action" href="action.html">
    <div class="thumb">🔫</div>
    <div>Action Games</div>
  </a>

  <a class="game puzzle" href="puzzle.html">
    <div class="thumb">🧠</div>
    <div>Puzzle Games</div>
  </a>

  <a class="game action" href="combat.html">
    <div class="thumb">⚔️</div>
    <div>Combat Games</div>
  </a>

</div>

<footer>
  © 2026 Axora — Real Game System
</footer>

<script>

/* SEARCH */
function searchGames(){
  let input = document.getElementById("search").value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    let text = games[i].innerText.toLowerCase();
    games[i].style.display = text.includes(input) ? "block" : "none";
  }
}

/* FILTER */
function filter(type){
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    if(type === "all"){
      games[i].style.display = "block";
    } else {
      games[i].style.display =
        games[i].classList.contains(type) ? "block" : "none";
    }
  }
}

</script>

</body>
</html>
