<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f0f0f;
  color: white;
}

header {
  background: #1a1a1a;
  text-align: center;
  padding: 20px;
  border-bottom: 1px solid #333;
}

h1 {
  margin: 0;
  font-size: 60px;
}

.nav {
  margin-top: 10px;
}

.nav button {
  background: #222;
  color: white;
  border: 1px solid #444;
  padding: 10px 14px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.nav button:hover {
  background: #333;
}

.search {
  text-align: center;
  margin: 20px;
}

.search input {
  width: 320px;
  padding: 12px;
  border-radius: 10px;
  border: none;
}

.title {
  font-size: 24px;
  margin: 20px;
}

.games {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

.game {
  width: 200px;
  background: #222;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  overflow: hidden;
  transition: 0.2s;
}

.game:hover {
  transform: scale(1.05);
  background: #333;
}

.game img {
  width: 100%;
  height: 100px;
  object-fit: cover;
}

.game div {
  padding: 10px;
  text-align: center;
}

footer {
  text-align: center;
  padding: 20px;
  background: #1a1a1a;
  margin-top: 30px;
  border-top: 1px solid #333;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button>Home</button>
    <button>Trending</button>
    <button>New</button>
  </div>
</header>

<div class="search">
  <input type="text" placeholder="Search games...">
</div>

<div class="title">🔥 Featured Games</div>

<div class="games">

  <a class="game" href="drift-king.html">
    <img src="https://picsum.photos/200/100?random=1">
    <div>Drift King</div>
  </a>

  <a class="game" href="https://www.crazygames.com/game/stunt-car-challenge" target="_blank">
    <img src="https://picsum.photos/200/100?random=2">
    <div>Stunt Car</div>
  </a>

  <a class="game" href="https://www.crazygames.com/game/battle-royale" target="_blank">
    <img src="https://picsum.photos/200/100?random=3">
    <div>Battle Game</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <img src="https://picsum.photos/200/100?random=4">
    <div>Puzzle Game</div>
  </a>

</div>

<footer>
  © 2026 Axora
</footer>

</body>
</html>
