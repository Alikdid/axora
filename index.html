<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1f;
  color: white;
}

/* HEADER */
header {
  background: #111827;
  padding: 25px;
  text-align: center;
  border-bottom: 1px solid #1f2937;
}

h1 {
  margin: 0;
  font-size: 60px;
}

/* NAV */
.nav button {
  background: #1f2937;
  color: white;
  border: 1px solid #374151;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.nav button:hover {
  background: #374151;
}

/* SEARCH */
.search {
  text-align: center;
  margin: 20px;
}

.search input {
  width: 360px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

/* TITLE */
.title {
  font-size: 26px;
  margin: 20px;
}

/* GRID */
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

/* CARD */
.game {
  background: #111827;
  border-radius: 15px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  border: 1px solid #1f2937;
  transition: 0.2s;
}

.game:hover {
  transform: scale(1.05);
  border-color: #60a5fa;
}

/* IMAGE */
.game img {
  width: 100%;
  height: 120px;
  object-fit: cover;
  background: #222;
}

/* TEXT */
.game div {
  padding: 10px;
  text-align: center;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  background: #111827;
  margin-top: 30px;
  border-top: 1px solid #1f2937;
  font-size: 12px;
  opacity: 0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button>Home</button>
    <button>Trending</button>
    <button>New</button>
    <button>Categories</button>
  </div>
</header>

<div class="search">
  <input type="text" id="search" onkeyup="searchGames()" placeholder="Search games...">
</div>

<div class="title">🔥 Featured Games</div>

<div class="games" id="games">

  <a class="game" href="drift-king.html">
    <img src="https://via.placeholder.com/400x200/1f2937/ffffff?text=Drift+King">
    <div>Drift King</div>
  </a>

  <a class="game" href="https://www.crazygames.com/game/stunt-car-challenge" target="_blank">
    <img src="https://via.placeholder.com/400x200/1f2937/ffffff?text=Stunt+Car">
    <div>Stunt Car</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <img src="https://via.placeholder.com/400x200/1f2937/ffffff?text=Battle+Game">
    <div>Battle Game</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <img src="https://via.placeholder.com/400x200/1f2937/ffffff?text=Puzzle+Game">
    <div>Puzzle Game</div>
  </a>

</div>

<footer>
  © 2026 Axora
</footer>

<script>
function searchGames() {
  let input = document.getElementById("search").value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for (let i = 0; i < games.length; i++) {
    let text = games[i].innerText.toLowerCase();
    games[i].style.display = text.includes(input) ? "block" : "none";
  }
}
</script>

</body>
</html>
