<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1020;
  color:white;
}

header{
  background:#111827;
  padding:20px;
  text-align:center;
}

h1{
  margin:0;
  font-size:45px;
}

.nav button{
  background:#1f2937;
  color:white;
  border:1px solid #374151;
  padding:10px 14px;
  margin:5px;
  border-radius:8px;
  cursor:pointer;
}

.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:300px;
  padding:10px;
  border-radius:8px;
  border:none;
}

.games{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  padding:20px;
}

.game{
  width:160px;
  background:#111827;
  padding:10px;
  border-radius:10px;
  text-align:center;
  border:1px solid #374151;
}

.thumb{
  font-size:40px;
  margin-bottom:10px;
}

#debug{
  text-align:center;
  color:lime;
  font-size:12px;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button onclick="filter('all')">Home</button>
    <button onclick="filter('racing')">Racing</button>
    <button onclick="filter('action')">Action</button>
    <button onclick="filter('puzzle')">Puzzle</button>
  </div>
</header>

<div id="debug">JS STATUS: LOADING...</div>

<div class="search">
  <input id="search" placeholder="Search games...">
</div>

<div class="games">

  <div class="game racing">
    <div class="thumb">🚗</div>
    Drift Boss
  </div>

  <div class="game racing">
    <div class="thumb">🏎️</div>
    Racing Game
  </div>

  <div class="game action">
    <div class="thumb">🔫</div>
    Action Game
  </div>

  <div class="game puzzle">
    <div class="thumb">🧠</div>
    Puzzle Game
  </div>

</div>

<script>

document.getElementById("debug").innerText = "JS STATUS: WORKING";

// FILTER
function filter(type){
  console.log("filter:", type);

  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    if(type === "all"){
      games[i].style.display = "block";
    } else {
      games[i].style.display =
        games[i].classList.contains(type) ? "block" : "none";
    }
  }
}

// SEARCH
document.getElementById("search").addEventListener("input", function(){
  let value = this.value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    let text = games[i].innerText.toLowerCase();
    games[i].style.display = text.includes(value) ? "block" : "none";
  }
});

</script>

</body>
</html>
