<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#050814;
  color:white;
}

header{
  background:#0f172a;
  padding:25px;
  text-align:center;
  border-bottom:1px solid #1f2937;
}

h1{
  margin:0;
  font-size:60px;
}

.nav button{
  background:#111827;
  color:white;
  border:1px solid #334155;
  padding:10px 14px;
  margin:5px;
  border-radius:10px;
  cursor:pointer;
}

.nav button:hover{
  border-color:#38bdf8;
}

.search{
  text-align:center;
  margin:20px;
}

.search input{
  width:380px;
  padding:12px;
  border-radius:10px;
  border:none;
  outline:none;
}

.games{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
  padding:20px;
}

.game{
  background:#0f172a;
  border:1px solid #1f2937;
  border-radius:15px;
  text-align:center;
  text-decoration:none;
  color:white;
  padding:15px;
  transition:0.2s;
  cursor:pointer;
}

.game:hover{
  transform:scale(1.05);
  border-color:#38bdf8;
}

.thumb{
  font-size:42px;
  margin-bottom:10px;
}

.hidden{
  display:none;
}

footer{
  text-align:center;
  padding:20px;
  margin-top:30px;
  background:#0f172a;
  font-size:12px;
  opacity:0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button onclick="filterGames('all')">Home</button>
    <button onclick="filterGames('racing')">Racing</button>
    <button onclick="filterGames('action')">Action</button>
    <button onclick="filterGames('puzzle')">Puzzle</button>
  </div>
</header>

<div class="search">
  <input id="search" onkeyup="searchGames()" placeholder="Search games...">
</div>

<div class="games">

  <div class="game racing">
    <div class="thumb">🚗</div>
    Drift Boss
  </div>

  <div class="game racing">
    <div class="thumb">🏎️</div>
    Stunt Cars
  </div>

  <div class="game action">
    <div class="thumb">🔫</div>
    Action Pack
  </div>

  <div class="game puzzle">
    <div class="thumb">🧠</div>
    Puzzle Pack
  </div>

</div>

<footer>
  © 2026 Axora
</footer>

<script>

function searchGames(){
  let input = document.getElementById("search").value.toLowerCase();
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    let text = games[i].innerText.toLowerCase();
    games[i].style.display = text.includes(input) ? "block" : "none";
  }
}

function filterGames(type){
  let games = document.getElementsByClassName("game");

  for(let i=0;i<games.length;i++){
    if(type === "all"){
      games[i].style.display = "block";
    } else {
      games[i].style.display =
        games[i].classList.contains(type) ? "block" : "none";
    }
  }
}

</script>

</body>
</html>
