<!DOCTYPE html>
<html>
<head>
<title>Axora</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f1a;
  color: white;
}

/* HEADER */
header {
  background: linear-gradient(90deg, #111827, #1f2937);
  padding: 25px;
  text-align: center;
  border-bottom: 1px solid #333;
}

h1 {
  margin: 0;
  font-size: 58px;
  letter-spacing: 2px;
}

.nav button {
  background: #1f2937;
  color: white;
  border: 1px solid #374151;
  padding: 10px 15px;
  margin: 5px;
  border-radius: 10px;
  cursor: pointer;
}

.nav button:hover {
  background: #374151;
}

/* SEARCH */
.search {
  text-align: center;
  margin: 20px;
}

.search input {
  width: 350px;
  padding: 12px;
  border-radius: 10px;
  border: none;
  outline: none;
}

/* SECTION */
.title {
  font-size: 26px;
  margin: 25px;
}

/* GRID */
.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 15px;
  padding: 20px;
}

/* GAME CARD */
.game {
  background: #111827;
  border-radius: 15px;
  overflow: hidden;
  text-decoration: none;
  color: white;
  transition: 0.2s;
  border: 1px solid #1f2937;
}

.game:hover {
  transform: scale(1.05);
  border-color: #3b82f6;
}

/* IMAGE */
.game img {
  width: 100%;
  height: 120px;
  object-fit: cover;
}

/* TEXT */
.game div {
  padding: 10px;
  text-align: center;
  font-weight: bold;
}

/* FOOTER */
footer {
  text-align: center;
  padding: 20px;
  margin-top: 30px;
  background: #111827;
  border-top: 1px solid #333;
  font-size: 12px;
  opacity: 0.7;
}
</style>

</head>

<body>

<header>
  <h1>AXORA</h1>

  <div class="nav">
    <button>Home</button>
    <button>Trending</button>
    <button>New</button>
    <button>Categories</button>
  </div>
</header>

<div class="search">
  <input type="text" placeholder="Search games...">
</div>

<div class="title">🔥 Featured Games</div>

<div class="games">

  <a class="game" href="drift-king.html">
    <img src="https://img.crazygames.com/games/drift-boss/cover-1583935126205.png" alt="">
    <div>Drift King</div>
  </a>

  <a class="game" href="https://www.crazygames.com/game/stunt-car-challenge" target="_blank">
    <img src="https://img.crazygames.com/games/stunt-car-challenge/cover-1627381931234.png" alt="">
    <div>Stunt Car</div>
  </a>

  <a class="game" href="https://www.crazygames.com/game/battle-royale" target="_blank">
    <img src="https://img.crazygames.com/games/battle-royale/cover-1600000000000.png" alt="">
    <div>Battle Game</div>
  </a>

  <a class="game" href="https://www.crazygames.com" target="_blank">
    <img src="https://img.crazygames.com/games/puzzle-fps/cover-1600000000001.png" alt="">
    <div>Puzzle Game</div>
  </a>

</div>

<footer>
  © 2026 Axora - Play Free Online Games
</footer>

</body>
</html>
